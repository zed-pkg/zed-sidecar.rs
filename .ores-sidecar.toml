protocol = "ores.sidecar-config.v1"

[runtimeUpdates]
provider = "ores-redis-lru-cache"
lruConfigPath = ".ores-lru.toml"
role = "server"
cache = "runtime-env"

[[sidecars]]
name = "zed-sidecar"
enabled = true
bindIp = "127.0.0.1"
bindPort = 9090
loopbackOnly = true
runtimeNamespace = "zed-pkg"
runtimeKeys = []
