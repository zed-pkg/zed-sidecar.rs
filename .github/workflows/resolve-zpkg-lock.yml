name: Resolve Zed lock candidate

on:
  pull_request:
    paths:
      - .zpkg.toml
      - .zpkg.lock
      - .github/workflows/resolve-zpkg-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact consumer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact consumer head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check out pinned Zed resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: c2606c87c8b077dde39d2303bc787077ceb2c9fd
          path: .resolver/zed-cli
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.1
      - name: Build exact Zed resolver
        working-directory: .resolver/zed-cli
        run: cargo build --release --locked --bin zed
      - name: Resolve project lock without package hooks
        env:
          ZED_PKG_HOME: ${{ runner.temp }}/zed-home
          ZED_PKG_ALLOW_BUILD: 'false'
          ZED_PKG_ALLOW_NATIVE_DEPS: 'false'
          ZED_PKG_ALLOW_INSTALL_HOOKS: 'false'
          ZED_PKG_INTERACTIVE: 'false'
        run: |
          set -euo pipefail
          resolver="$PWD/.resolver/zed-cli/target/release/zed"
          "$resolver" install
          test -s .zpkg.lock
          "$resolver" validate --manifest .zpkg.toml --lock .zpkg.lock --require-lock --json \
            > "$RUNNER_TEMP/zpkg-validate.json"
          sha256sum .zpkg.lock
      - name: Upload resolved lock and validation evidence
        uses: actions/upload-artifact@043fb46d1a93cbc5d6e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-sidecar-zpkg-lock
          path: |
            .zpkg.lock
            ${{ runner.temp }}/zpkg-validate.json
          if-no-files-found: error
          retention-days: 7
